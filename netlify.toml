[build]
  command = "npm install --legacy-peer-deps && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Nur VITE_-Variablen werden ins Frontend gebundled
  # GOOGLE_CLIENT_SECRET (ohne VITE_) bleibt nur serverseitig
  SECRETS_SCAN_OMIT_KEYS = "VITE_GOOGLE_REDIRECT_URI,VITE_GOOGLE_CLIENT_ID,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
